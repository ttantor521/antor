<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TAWSIF ANTOR</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: #ffffff;
      background:
        radial-gradient(circle at top, #482080 0%, transparent 45%),
        linear-gradient(135deg, #10091f, #1b1030, #090612);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 15px;
    }

    .container {
      width: 100%;
      max-width: 520px;
      text-align: center;
      padding: 30px 22px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 25px;
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(12px);
    }

    .avatar {
      width: 105px;
      height: 105px;
      margin: 0 auto 18px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #a855f7, #5b21b6);
      border: 3px solid rgba(255, 255, 255, 0.8);
      box-shadow: 0 0 25px rgba(168, 85, 247, 0.4);
      font-size: 36px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    h1 {
      font-size: clamp(27px, 7vw, 36px);
      letter-spacing: 2px;
      margin-bottom: 10px;
      overflow-wrap: anywhere;
    }

    .subtitle {
      color: #d2c2ee;
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 28px;
    }

    .section-title {
      font-size: 19px;
      margin-bottom: 18px;
      color: #e9d5ff;
    }

    .social-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 13px;
    }

    .social-link {
      min-height: 58px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 13px 10px;
      border-radius: 14px;
      text-decoration: none;
      color: #ffffff;
      font-size: 15px;
      font-weight: bold;
      border: 1px solid rgba(255, 255, 255, 0.12);
      background: rgba(255, 255, 255, 0.08);
      transition: transform 0.2s, background 0.2s;
    }

    .social-link:hover {
      transform: translateY(-3px);
      background: rgba(255, 255, 255, 0.16);
    }

    .social-link:active {
      transform: scale(0.97);
    }

    .social-link svg {
      width: 23px;
      height: 23px;
      flex-shrink: 0;
      fill: currentColor;
    }

    .facebook {
      color: #70a5ff;
    }

    .instagram {
      color: #ff8bc7;
    }

    .x-twitter {
      color: #ffffff;
    }

    .telegram {
      color: #51c8ff;
    }

    .youtube {
      color: #ff5b66;
    }

    .whatsapp {
      color: #55e89a;
    }

    footer {
      margin-top: 28px;
      color: #a99abf;
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 360px) {
      .container {
        padding: 25px 15px;
      }

      .social-grid {
        gap: 9px;
      }

      .social-link {
        gap: 7px;
        font-size: 13px;
        padding: 12px 7px;
      }
    }
  </style>
</head>
